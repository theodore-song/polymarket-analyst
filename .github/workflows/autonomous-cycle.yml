name: Autonomous paper cycle

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - api/state.js
      - scripts/run-autonomous-cycle.mjs
      - .github/workflows/autonomous-cycle.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-paper-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-autonomous-cycle.mjs
        env:
          ARENA_URL: https://polymarket-site-eta.vercel.app
          EXPECTED_BUILD: "146"
          RUNTIME_BRANCH: runtime-state
          RUNTIME_STATE_PATH: runtime/state.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the next five-minute slot
        if: always()
        shell: bash
        run: |
          now=$(date +%s)
          next=$(( (now / 300 + 1) * 300 + 15 ))
          delay=$(( next - now ))
          echo "Next autonomous slot starts in ${delay}s"
          sleep "$delay"
      - name: Dispatch the next autonomous cycle
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-cycle.yml/dispatches" \
            --data '{"ref":"main"}'
